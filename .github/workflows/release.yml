name: Build and release Excel add-in

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: python-excel-releases
  queue: max

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONEXCEL_RELEASE_TAG: v0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Build Windows x64 XLL
        run: python build.py
      - name: Verify packaged runtime and restart helper
        run: python tests/verify_package.py
      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:PYTHONEXCEL_RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          $existing = gh release view $tag --repo $repo --json isDraft,targetCommitish,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existing | ConvertFrom-Json
            if ($existing.targetCommitish -ne $env:GITHUB_SHA) { throw "Release tag already has a different target" }
            if (!$existing.isDraft) {
              if ('PythonExcel.xll' -notin $existing.assets.name) { throw "Published release is missing its XLL" }
              exit 0
            }
          }
          $latest = gh api "repos/$repo/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0) { throw "Cannot determine the latest published release" }
          $promote = ([version]$tag.Substring(1) -gt [version]$latest.Substring(1)).ToString().ToLowerInvariant()
          $digest = (Get-FileHash dist/PythonExcel.xll -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @(
            'Download **PythonExcel.xll** for 64-bit desktop Excel on Windows.'
            ''
            "Built from commit $env:GITHUB_SHA."
            ''
            "SHA-256: $digest"
            ''
            "[Installation and usage](https://github.com/$repo/blob/$tag/README.md)"
          ) | Set-Content -Encoding utf8 $notes
          if ($existing -and $existing.isDraft) {
            gh release upload $tag dist/PythonExcel.xll --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo $repo --draft=false "--latest=$promote" --notes-file $notes
          } else {
            gh release create $tag dist/PythonExcel.xll --repo $repo --target $env:GITHUB_SHA --title "Python for Excel $tag" "--latest=$promote" --notes-file $notes
          }
          exit $LASTEXITCODE
